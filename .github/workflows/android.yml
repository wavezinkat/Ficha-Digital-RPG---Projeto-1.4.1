# Gera o APK do app Android a cada push (ou pelo botão "Run workflow" na aba Actions).
# O APK fica em Releases > "App Android" e também nos artefatos da execução.
name: App Android (APK)

on:
  push:
    branches: [main, master]
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # o servidor do GitHub (ubuntu-24.04) já vem com o Android SDK instalado
      - name: Conferir Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools" | tail -n 8
          java -version

      - name: Instalar dependências
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Preparar projeto Android
        working-directory: app
        run: node scripts/preparar.mjs android

      - name: Número da versão
        run: |
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"3.5.${{ github.run_number }}\"/" app/android/app/build.gradle
          grep -E "versionCode|versionName" app/android/app/build.gradle

      # Sempre a mesma chave: assim o APK novo instala por cima do antigo e as fichas salvas ficam.
      - name: Chave de assinatura fixa
        run: mkdir -p ~/.android && cp app/debug.keystore ~/.android/debug.keystore

      - name: Compilar APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Renomear
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk Ficha141.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ficha141-android
          path: Ficha141.apk

      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: App Android ${{ github.run_number }}
          body: "Baixe o Ficha141.apk no celular e instale. Se já tem o app, instala por cima e as fichas continuam salvas."
          make_latest: true
          files: Ficha141.apk
